<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Welcome to GetWork</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary": "#1a66ff",
                    "on-primary": "#ffffff",
                    "surface": "#f8f9fb",
                    "on-surface": "#1a1c1e",
                    "outline": "#74777f",
                    "outline-variant": "#c4c6cf",
                    "surface-container-low": "#f2f4f6",
                    "surface-container": "#eceef0",
                    "surface-container-highest": "#e2e2e6"
            },
            "borderRadius": {
                    "DEFAULT": "0.5rem",
                    "lg": "0.5rem",
                    "xl": "1rem",
                    "2xl": "1.5rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "sans": ["Plus Jakarta Sans", "sans-serif"],
                    "headline": ["Plus Jakarta Sans", "sans-serif"]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #f8f9fb;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .hero-bg-dots {
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen text-on-surface">
<!-- Main Content Container -->
<main class="flex-1 flex flex-col items-center justify-between px-8 py-12 max-w-md mx-auto w-full">
<!-- Illustration Section (Inspired by IMAGE_2) -->
<div class="w-full relative flex flex-col items-center justify-center pt-8 mb-10" style="opacity: 1; transform: translateY(0px); transition: 0.6s cubic-bezier(0.22, 1, 0.36, 1);">
<!-- Decorative Dashed Paths (Inspired by IMAGE_2) -->
<svg class="absolute inset-0 w-full h-full -z-10 opacity-20" fill="none" viewBox="0 0 300 300">
<path d="M50 250C100 200 200 200 250 150" stroke="#1a66ff" stroke-dasharray="6 6" stroke-width="2"></path>
<circle cx="60" cy="80" r="15" stroke="#1a66ff" stroke-dasharray="3 3" stroke-width="1"></circle>
<circle cx="240" cy="100" r="20" stroke="#1a66ff" stroke-dasharray="3 3" stroke-width="1"></circle>
</svg>
<div class="relative z-10 w-full aspect-square max-w-[280px] flex items-center justify-center animate-float">
<!-- Using placeholder for the character illustration style -->
<img alt="Modern character illustration" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AG849Zt_VAn9Xl5D_O7X_pMhV5N_98u0f1v4z1v3v2v1v0z9x8y7w6v5u4t3s2r1q0p=s1024">
<!-- Floating Icon Badges (Inspired by IMAGE_2 background elements) -->
<div class="absolute top-4 right-0 w-10 h-10 bg-white rounded-full shadow-sm flex items-center justify-center border border-surface-container">
<span class="material-symbols-outlined text-primary text-[20px]">local_cafe</span>
</div>
<div class="absolute top-12 left-4 w-12 h-12 bg-white rounded-full shadow-sm flex items-center justify-center border border-surface-container">
<span class="material-symbols-outlined text-primary text-[24px]">schedule</span>
</div>
</div>
</div>
<!-- Text Content -->
<div class="w-full text-center mb-10" style="opacity: 1; transform: translateY(0px); transition: 0.6s cubic-bezier(0.22, 1, 0.36, 1);">
<h1 class="text-[28px] leading-[36px] font-bold text-[#1a1c1e] mb-4">
                Find nearby work in minutes.
            </h1>
<p class="text-[16px] leading-[24px] text-outline px-2">
                Discover part-time, hourly and temporary jobs around your location.
            </p>
</div>
<!-- Action Buttons Cluster -->
<div class="w-full space-y-4" style="opacity: 1; transform: translateY(0px); transition: 0.6s cubic-bezier(0.22, 1, 0.36, 1);">
<!-- Primary Action -->
<button class="w-full h-[56px] bg-primary text-on-primary rounded-xl font-bold shadow-lg shadow-primary/20 transition-all active:scale-[0.98] hover:brightness-110">
                Create Account
            </button>
<!-- Social Login (Updated to outlined/soft-blue style from IMAGE_2) -->
<button class="w-full h-[56px] bg-transparent border border-outline-variant text-on-surface rounded-xl flex items-center justify-center gap-3 font-semibold transition-all active:scale-[0.98] hover:bg-surface-container-low">
<svg height="20" viewBox="0 0 24 24" width="20">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="">Continue with Google</span>
</button>
<!-- Secondary Action -->
<button class="w-full h-[56px] bg-transparent text-outline rounded-xl font-medium transition-all hover:text-on-surface active:bg-surface-container">
                Continue as Guest
            </button>
</div>
<!-- Pagination Indicator (Updated style from IMAGE_2) -->
<div class="mt-8 flex justify-center items-center gap-1.5" style="opacity: 1; transform: translateY(0px); transition: 0.6s cubic-bezier(0.22, 1, 0.36, 1);">
<div class="w-1.5 h-1.5 rounded-full bg-outline-variant"></div>
<div class="w-1.5 h-1.5 rounded-full bg-outline-variant"></div>
<div class="w-5 h-1.5 rounded-full bg-primary"></div>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const elements = document.querySelectorAll('main > *');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(16px)';
                el.style.transition = 'all 0.6s cubic-bezier(0.22, 1, 0.36, 1)';
                
                setTimeout(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 80 * index);
            });
        });
    </script>


</body></html>

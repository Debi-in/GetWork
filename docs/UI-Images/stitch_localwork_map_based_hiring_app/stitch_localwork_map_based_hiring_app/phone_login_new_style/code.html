                    "error": "#ba1a1a",

                    "error-container": "#ffdad6",
                    "on-error-container": "#410002",
                    "background": "#f8f9fb",
                    "on-background": "#191c20",
                    "surface": "#f8f9fb",
                    "on-surface": "#191c20",
                    "surface-variant": "#dfe2eb",
                    "on-surface-variant": "#43474e",
                    "outline": "#73777f",
                    "outline-variant": "#c3c7cf",
                    "inverse-surface": "#2e3135",
                    "inverse-on-surface": "#f0f0f4",
                    "inverse-primary": "#aac7ff",
                    "surface-dim": "#d9dadc",

      }

<style>
        body {
            background-color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .dashed-path {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .input-soft-blue {
            background-color: #f2f7ff;
            border: 1px solid transparent;
        }
        .input-soft-blue:focus-within {
            border-color: #1a66ff;
            background-color: #ffffff;
        }
    </style>
</head>
<body class="antialiased text-on-surface bg-white">
<div class="min-h-screen flex flex-col max-w-md mx-auto relative overflow-hidden">
<!-- SVG Decoration: Dashed Line Path -->
<svg class="dashed-path" fill="none" viewBox="0 0 400 800" xmlns="http://www.w3.org/2000/svg">
<path d="M-50,100 Q150,50 350,150 T500,100" stroke="#E5E7EB" stroke-dasharray="8 8" stroke-width="2"></path>
<path d="M450,400 Q250,450 50,350 T-100,450" stroke="#E5E7EB" stroke-dasharray="8 8" stroke-width="2"></path>
</svg>
<!-- Navigation Header -->
<header class="flex items-center px-6 py-8 z-10">
<button aria-label="पछाडि जानुहोस्" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low hover:bg-surface-container-high transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined text-primary text-[20px]">arrow_back</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 px-margin-mobile z-10 flex flex-col">
<!-- Header Section -->
<div class="mb-10">
<h1 class="text-[32px] leading-tight font-bold text-on-surface mb-2">Create<br>Account</h1>
</div>
<!-- Form Section -->
<div class="space-y-6">
<!-- Phone Input Field -->
<div class="space-y-2">
<label class="text-[14px] font-semibold text-on-surface-variant block">Mobile Number</label>
<div class="relative flex items-center">
<div class="flex items-center gap-2 px-4 py-4 input-soft-blue rounded-xl transition-all w-full">
<div class="flex items-center gap-2 border-r border-outline-variant pr-3 cursor-pointer">
<div class="w-6 h-4 overflow-hidden rounded-sm flex items-center justify-center bg-gray-100">
<img alt="Flag" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAvZO4BYfhvgHxdrYrfFFfiPFIDAMBU3Uq-ZjmzudfVHxA069dIPLL8_BzdQ5DyzZ8HZt8J3p1a7AWpTD84pMP9wEPISosZzbGpxAuL5UrB5Aa6kwGP3Msd6YR6DWoBF1f_WriyVFzEhherGSs2pOBzkn-g8Oli-fGcJy-bf7q8-bLsBEl9QsoUBtM9_jxkxBTz_IHPeZ6hNp2ilGoF6ds5ZO0ySaFJIfrVVPA-pLorAZhe_4oOmNhfRg">
</div>
<span class="text-[16px] font-semibold text-on-surface">+९७७</span>
<span class="material-symbols-outlined text-outline text-sm">expand_more</span>
</div>
<input autofocus="" class="flex-1 bg-transparent border-none focus:ring-0 text-[16px] font-semibold p-0 placeholder:text-outline-variant text-on-surface" placeholder="९८XXXXXXXX" type="tel">
</div>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-[56px] bg-primary text-white font-bold text-[16px] rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all hover:brightness-110 flex items-center justify-center">Create account</button>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="flex-1 h-[1px] bg-outline-variant/30"></div>
<span class="text-[12px] font-bold text-outline uppercase tracking-wider">or</span>
<div class="flex-1 h-[1px] bg-outline-variant/30"></div>
</div>
<!-- Secondary Actions -->
<div class="space-y-4">
<button class="w-full h-[56px] bg-white border border-outline-variant flex items-center justify-center gap-3 rounded-xl hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<img alt="Google" class="w-5 h-5 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBVFcv6_xNob_u_djWutfRsylYF7klr0mBIkxIjeKhaZ5ZMWqmdfyTpPHWXWi3c4xnf0W8FgVck0JnvCmQsqGTiTCHgxLRTRgJjal1sqPAXGCzkTAlfi7o_7Kc8luPQ_8FCmlN8kLYWqFEGaC8QfJOyA6mweFjHZbAD6Bjpe0AuxyseXN37YSKyy_EliqHDkMi-r4uQV2nOd6RVGwZSqWE8NfF1szMBjZbvZ6yBKZ2x9B84pBwhig1aag">
<span class="text-[16px] font-semibold text-on-surface">Sign up with Google</span>
</button>

</div>
</div>
<div class="flex-grow"></div>
<!-- Terms & Footer -->
<footer class="pb-8 text-center space-y-4">
<p class="text-[13px] leading-relaxed text-on-surface-variant px-6">
                Already have an account? <a class="text-primary font-bold underline decoration-primary/30 underline-offset-4" href="#">Log in</a>
</p>
<p class="text-[12px] text-on-surface-variant/60">
                By continuing, you agree to our <a class="underline" href="#">Terms</a> and <a class="underline" href="#">Privacy Policy</a>.
            </p>
</footer>
</main>
<!-- Notification Bar -->
<div class="fixed bottom-margin-mobile left-margin-mobile right-margin-mobile transform translate-y-20 opacity-0 transition-all duration-300 z-50" id="toast">
<div class="bg-inverse-surface text-inverse-on-surface px-4 py-3 rounded-xl shadow-xl flex items-center gap-3">
<span class="material-symbols-outlined text-primary">info</span>
<p class="text-[14px] font-medium">Please enter a valid phone number.</p>
</div>
</div>
</div>
<script>
    const input = document.querySelector('input[type="tel"]');
    const primaryBtn = document.querySelector('button.bg-primary');
    const toast = document.getElementById('toast');

    primaryBtn.addEventListener('click', () => {
        const val = input.value.trim();
        if (val.length < 10) {
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, 3000);

            input.closest('.input-soft-blue').style.borderColor = '#ba1a1a';
            setTimeout(() => input.closest('.input-soft-blue').style.borderColor = 'transparent', 2000);
        }
    });

    input.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 10);
    });
</script>


</body></html>

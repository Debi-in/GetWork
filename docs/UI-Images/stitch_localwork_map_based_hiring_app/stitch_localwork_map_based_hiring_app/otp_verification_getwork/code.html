<script>
        // OTP Focus Management
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('keyup', (e) => {
                if (e.key >= 0 && e.key <= 9) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                } else if (e.key === 'Backspace') {
                    if (index > 0) {
                        inputs[index - 1].focus();
                    }
                }
            });
        });

        // Simple Countdown Timer
        let timeLeft = 59;
        const timerElement = document.getElementById('timer');
        const resendBtn = document.getElementById('resend-btn');

        const countdown = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.classList.add('hidden');
                resendBtn.disabled = false;
            } else {
                resendBtn.disabled = true;
                timerElement.innerText = `in 00:${timeLeft < 10 ? '0' + timeLeft : timeLeft}`;
                timeLeft -= 1;
            }
        }, 1000);

        // Verification Trigger Logic
        const verifyBtn = document.querySelector('.verify-btn');
        verifyBtn.addEventListener('click', () => {
            verifyBtn.innerHTML = `
                <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                <span>Verifying...</span>
            `;
            setTimeout(() => {
                // Success state simulation
                verifyBtn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> <span>Success</span>`;
                verifyBtn.classList.replace('bg-sage-accent', 'bg-green-600');
            }, 1500);
        });
    </script>

<script>
        // Micro-interaction: Update map movement slightly on mouse move (desktop only)
        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth > 768) {
                const map = document.querySelector('[data-location]');
                const x = (window.innerWidth / 2 - e.pageX) / 50;
                const y = (window.innerHeight / 2 - e.pageY) / 50;
                map.style.transform = `scale(1.1) translate(${x}px, ${y}px)`;
            }
        });

        // Toggle Active State logic for demo
        const navItems = document.querySelectorAll('nav a');
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                navItems.forEach(i => {
                    i.classList.remove('bg-primary-container', 'text-on-primary-container');
                    i.classList.add('text-on-surface-variant');
                });
                item.classList.add('bg-primary-container', 'text-on-primary-container');
                item.classList.remove('text-on-surface-variant');
            });
        });
    </script>

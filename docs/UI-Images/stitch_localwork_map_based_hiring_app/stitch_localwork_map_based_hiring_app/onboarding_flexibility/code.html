<style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f7f9ff;
        color: #121d26;
        -webkit-font-smoothing: antialiased;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .onboarding-gradient {
        background: radial-gradient(circle at 50% -20%, #dae2ff 0%, #f7f9ff 70%);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col overflow-hidden select-none touch-none">
<!-- Top AppBar (Simplified for Onboarding) -->
<header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-margin-mobile py-4">
<div class="text-primary font-bold text-headline-lg-mobile font-headline-lg-mobile">GetWork</div>
<button class="text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high px-4 py-2 rounded-lg transition-colors">
            Skip
        </button>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col justify-center items-center px-margin-mobile pt-16 pb-32 onboarding-gradient opacity-0 translate-y-4">
<!-- Hero Illustration Container -->
<div class="relative w-full max-w-sm aspect-square mb-xl flex items-center justify-center">
<!-- Background Decorative Elements -->
<div class="absolute inset-0 bg-primary-container/5 rounded-full blur-3xl transform -scale-95"></div>
<!-- Principal Illustration -->
<div class="relative z-10 w-full h-full rounded-xl overflow-hidden shadow-sm">
<img class="w-full h-full object-cover rounded-xl" data-alt="A clean, high-end 3D digital illustration of a smiling young worker in a professional apron shaking hands with a friendly local shop owner in front of a modern, airy neighborhood cafe. The scene is bathed in warm, optimistic morning light with soft shadows. The color palette uses a sophisticated blend of Primary Blue and soft beige tones, conveying a sense of professional reliability and local community warmth. The background is slightly blurred to keep the focus on the trust-building interaction between the two people." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDyq54S5UGQ31wf2QkaGkSksCnyy4wc7QcpM_u5v33tLGBN-k9ZQMoEjcBQria4jO4vJn_QTQTbnMmaDj2KoGeW0JLtS8NhowCN5zJ014-pKd6nyF9eScLt2QQKJKw2CyFKwfdFpBJ62rQTWTyyUsPxqfLk1KYCldVxV-4aBaEO4IuAwK0qi1vcViuPcH2Mf-yV6SI7yAty6DZXmyBs0v6xKZ9kMhgn5vdJXVHpxV0_rU6BgQeJ6T7cgg">
</div>
<!-- Floating Badge for Visual Interest -->
<div class="absolute -bottom-4 -right-4 bg-white p-4 rounded-xl shadow-lg flex items-center gap-3 animate-bounce shadow-blue-900/5">
<div class="w-10 h-10 bg-primary-fixed rounded-lg flex items-center justify-center text-primary">
<span class="material-symbols-outlined">schedule</span>
</div>
<div>
<div class="text-label-md font-label-md text-on-surface">Shift Picked</div>
<div class="text-label-sm font-label-sm text-on-surface-variant">Today, 2PM - 6PM</div>
</div>
</div>
</div>
<!-- Text Content -->
<div class="text-center max-w-md">
<h1 class="text-headline-lg font-headline-lg text-on-surface mb-md">
                Flexible Shifts
            </h1>
<p class="text-body-lg font-body-lg text-on-surface-variant px-4">
                Pick shifts that fit your schedule, from cafes to delivery and more.
            </p>
</div>
</main>
<!-- Navigation Footer -->
<footer class="fixed bottom-0 left-0 right-0 p-margin-mobile bg-white/80 backdrop-blur-md rounded-t-xl z-50">
<div class="max-w-md mx-auto flex flex-col items-center gap-lg">
<!-- Progress Dots -->
<div class="flex gap-2">
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-6 h-2 rounded-full bg-primary transition-all duration-300"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
</div>
<!-- Action Button -->
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-headline-sm text-headline-sm shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2" onclick="window.location.reload()">
                Next
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</footer>
<!-- Interactive Micro-interactions -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Subtle entrance animations
            const mainContent = document.querySelector('main');
            mainContent.classList.add('opacity-0', 'translate-y-4');
            
            setTimeout(() => {
                mainContent.classList.remove('opacity-0', 'translate-y-4');
                mainContent.classList.add('opacity-100', 'translate-y-0', 'transition-all', 'duration-700', 'ease-out');
            }, 100);

            // Button active state interaction
            const nextBtn = document.querySelector('button');
            nextBtn.addEventListener('mousedown', () => {
                nextBtn.classList.add('scale-95');
            });
            nextBtn.addEventListener('mouseup', () => {
                nextBtn.classList.remove('scale-95');
            });
        });
    </script>


</body></html>

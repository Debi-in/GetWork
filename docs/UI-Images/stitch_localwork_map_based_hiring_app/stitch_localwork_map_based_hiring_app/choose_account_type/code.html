<!-- Global Visual Tokens & Micro-interactions Script -->
<script>
        function selectType(type) {
            const workerCard = document.getElementById('worker-card');
            const businessCard = document.getElementById('business-card');
            
            // Remove previous active states
            workerCard.classList.remove('active-ring', 'bg-white/80');
            businessCard.classList.remove('active-ring', 'bg-white/80');
            
            // Apply selection effect
            const activeEl = type === 'worker' ? workerCard : businessCard;
            activeEl.classList.add('active-ring', 'bg-white/80');
            
            // Simple visual feedback before navigation
            activeEl.style.transform = 'scale(0.98)';
            setTimeout(() => {
                activeEl.style.transform = 'scale(1)';
                console.log(`Selected Account Type: ${type}`);
                // In a real app, this would route to sign-up for that type
            }, 150);
        }

        // Intersection Observer for fade-in animations
        const observerOptions = {
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('opacity-100');
                    entry.target.classList.remove('opacity-0', 'translate-y-10');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.animate-fade-in').forEach(el => {
            el.classList.add('transition-all', 'duration-700', 'opacity-0', 'translate-y-10');
            observer.observe(el);
        });
    </script>
<style>
        @keyframes fadeIn {

            to { opacity: 1; transform: translateY(0); }
        }

<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FAF9F6;
        }

        .liquid-glass {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        .ivory-gradient {
            background: radial-gradient(circle at top right, #FFFFFF 0%, #FAF9F6 40%, #F3F1ED 100%);
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        .glass-blob {
            position: absolute;
            filter: blur(60px);
            z-index: 0;
            opacity: 0.4;
            transition: all 5s ease;
        }

        .liquid-layer {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.1) 100%);
            pointer-events: none;
        }

        .logo-glow {
            filter: drop-shadow(0 0 15px rgba(124, 169, 130, 0.4));
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
    </style>

<body class="ivory-gradient min-h-screen flex flex-col items-center justify-center overflow-hidden relative">

<div class="glass-blob w-[300px] h-[300px] bg-tertiary-fixed/20 rounded-full top-1/2 left-1/3 animate-float" style="animation-delay: 4s;"></div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex flex-col items-center justify-center text-center px-margin-mobile">
<!-- Brand Logo Container with Liquid Depth -->

<!-- Glass Depth Ring -->

<!-- Logo: Location Pin + Briefcase Hybrid -->

<div class="relative flex items-center justify-center">
<!-- The Sage Green Visual Anchor -->

                        location_on
                    </span>
<!-- Inner Briefcase Core -->

<span class="material-symbols-outlined text-warm-ivory text-[40px] md:text-[56px]" style="font-variation-settings: 'FILL' 1;">

</div>
</div>

<!-- Interactive Progress Hint -->
<div class="mt-xxl flex flex-col items-center gap-sm">
<div class="w-48 h-1 bg-outline-variant/20 rounded-full overflow-hidden relative">

            </span>
</div>
</main>
<!-- Navigation Shell (Suppressed as per "Task-Focused" rule for Splash screens) -->
<!-- We skip TopAppBar and BottomNavBar here as this is a Splash screen -->
<!-- Interactive Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progress-bar');
            
            // Initial loading animation trigger
            setTimeout(() => {
                progressBar.style.width = '100%';
            }, 100);

            // Subtle mouse parallax effect for the "Liquid" feel
            document.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
                const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
                
                const blobs = document.querySelectorAll('.glass-blob');
                blobs.forEach((blob, index) => {
                    const factor = (index + 1) * 2;
                    blob.style.transform = `translate(${moveX * factor}px, ${moveY * factor}px)`;
                });
            });

            // Auto-redirect simulation (Logic only, no actual redirect)
            setTimeout(() => {
                console.log("Splash sequence complete. Transitioning to Home Map...");
            }, 3500);
        });
    </script>
<!-- Content Card Grid (Optional background context for "Work Around You" feel) -->

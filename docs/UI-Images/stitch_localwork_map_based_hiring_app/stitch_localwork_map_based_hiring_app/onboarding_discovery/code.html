<body class="flex flex-col min-h-screen text-on-surface">
<!-- Top Navigation (Shell Supression active for Transactional) -->

<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile pt-xxl">

<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">location_on</span>
<span class="font-label-md text-label-md text-on-surface-variant">$22/hr</span>
</div>
</div>

<div class="text-center max-w-xs mx-auto mb-xxl">

                Find Local Work

                Discover part-time and hourly jobs right in your neighborhood.
            </p>
</div>

<!-- Footer Actions -->

<div class="h-2 rounded-full transition-all duration-300 dot-inactive"></div>

<button class="w-full h-[56px] bg-primary text-on-primary rounded-xl font-headline-sm text-headline-sm shadow-md active:scale-95 transition-transform flex items-center justify-center gap-2 group" onclick="nextStep()">
                Next
                <span class="material-symbols-outlined transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</div>
</footer>
<!-- Micro-interaction Script -->
<script>
        function nextStep() {
            // Placeholder for navigation logic to Page 2
            const body = document.querySelector('body');
            body.style.opacity = '0';
            body.style.transition = 'opacity 0.4s ease-out';
            setTimeout(() => {
                console.log('Navigating to onboarding step 2...');
                // In a real app: window.location.href = '/onboarding/2';
                body.style.opacity = '1';
            }, 400);
        }

        // Ripple Effect for button
        const btn = document.querySelector('button');
        btn.addEventListener('click', function(e) {
            let x = e.clientX - e.target.offsetLeft;
            let y = e.clientY - e.target.offsetTop;
            let ripples = document.createElement('span');
            ripples.style.left = x + 'px';
            ripples.style.top = y + 'px';
            this.appendChild(ripples);
            setTimeout(() => { ripples.remove() }, 1000);
        });
    </script>

<script>
        const main = document.querySelector('main');
        let isDragging = false;
        let startX, startY;

        main.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.pageX;
            startY = e.pageY;
        });

        main.addEventListener('mouseleave', () => { isDragging = false; });
        main.addEventListener('mouseup', () => { isDragging = false; });

        main.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const x = e.pageX - startX;
            const y = e.pageY - startY;
            const markers = document.querySelectorAll('.z-30, .z-20');
            markers.forEach(marker => {
                marker.style.transform = `translate(${x * 0.08}px, ${y * 0.08}px)`;
            });
        });

        main.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].pageX;
            startY = e.touches[0].pageY;
        });

        main.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const x = e.touches[0].pageX - startX;
            const y = e.touches[0].pageY - startY;
            const markers = document.querySelectorAll('.z-30, .z-20');
            markers.forEach(marker => {
                marker.style.transform = `translate(${x * 0.08}px, ${y * 0.08}px)`;
            });
        });

        main.addEventListener('touchend', () => { isDragging = false; });
    </script>

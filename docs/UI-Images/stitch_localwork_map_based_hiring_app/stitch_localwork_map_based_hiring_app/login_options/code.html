<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('.btn-press').forEach(button => {
            button.addEventListener('click', (e) => {
                // Subtle visual feedback can be added here
                console.log('Login attempt initiated');
            });
        });
        
        // Lightweight atmospheric float animation for the brand logo
        const logo = document.querySelector('.w-24.h-24');
        if (logo) {
            let angle = 0;
            function animate() {
                angle += 0.02;
                const yOffset = Math.sin(angle) * 4;
                logo.style.transform = `translateY(${yOffset}px)`;
                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>

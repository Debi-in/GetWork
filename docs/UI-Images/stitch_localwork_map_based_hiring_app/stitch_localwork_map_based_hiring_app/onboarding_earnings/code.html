<script>
        // Micro-interaction for the Get Started button
        const startBtn = document.querySelector('button');
        const overlay = document.getElementById('success-feedback');
        
        startBtn.addEventListener('click', () => {
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            overlay.querySelector('div').classList.remove('scale-90');
            overlay.querySelector('div').classList.add('scale-100');
            
            // Artificial delay to simulate transition to next app state
            setTimeout(() => {
                // In a real app, this would navigate to the Login/Auth screen
                console.log('Navigating to login options...');
            }, 1500);
        });

        // Floating animation for UI elements
        const cards = document.querySelectorAll('.bg-white\/90');
        cards.forEach((card, i) => {
            card.style.animation = `bounce 3s infinite ease-in-out ${i * 0.5}s`;
        });
    </script>
